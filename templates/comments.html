<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Комментарии</title>
</head>
<body>
    <h1>Комментарии</h1>
    <form action="/comments" method="post">
        <textarea name="text" rows="4" cols="50" placeholder="Введите текст..."></textarea>
        <br><br>
        <button type="submit">Отправить</button>
    </form>
    <h2>Список</h2>
    <ul>
        {% for comment in comments %}
        <li>{{ comment | safe }}</li>
        {% endfor %}
    </ul>
</body>
</html>
